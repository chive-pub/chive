apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chive-dev

resources:
  - ../../base

# No namePrefix.
#
# Each overlay already deploys into its own namespace, so a prefix isolates
# nothing the namespace does not. What it did do was rename every Service while
# the addresses in the ConfigMap stayed unprefixed, so no pod could resolve its
# dependencies.

commonLabels:
  environment: development

# Override images with dev tags
images:
  - name: chive
    newName: ghcr.io/chive-pub/chive
    newTag: develop
  - name: chive-frontend
    newName: ghcr.io/chive-pub/chive-frontend
    newTag: develop

patches:
  # Reduce replicas for development
  - target:
      kind: Deployment
      name: chive-appview
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: chive-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Reduce resources for development
  - target:
      kind: Deployment
      name: chive-appview
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

  - target:
      kind: Deployment
      name: chive-indexer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

  # Reduce database storage for development
  - target:
      kind: StatefulSet
      name: postgresql
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: StatefulSet
      name: neo4j
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi

  # Use development log level
  - target:
      kind: ConfigMap
      name: chive-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug

  # Environment name and log level.
  #
  # This was a `configMapGenerator` with `behavior: merge` naming a ConfigMap
  # that exists in no base. Kustomize can only merge a generator into another
  # generator, so `kubectl kustomize` failed outright — every overlay was
  # unbuildable, and no workflow built one, so none of them said so.
  # `chive-config` arrives from base as a plain resource, and a patch is how
  # you override one.
  - target:
      kind: ConfigMap
      name: chive-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: chive-config
      data:
        NODE_ENV: "development"

  # Drop autoscaling and disruption budgets: development runs one replica of
  # everything, so an HPA has nothing to scale and a PDB that requires one
  # available pod blocks every voluntary eviction — including a node drain.
  #
  # These were `patchesStrategicMerge` entries pointing at multi-document
  # delete files, which is the deprecated field and the reason
  # `kubectl kustomize` could not build this overlay at all. Expressed as
  # `patches` they work and the deprecation goes away.
  - target:
      kind: HorizontalPodAutoscaler
      name: chive-appview-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: chive-appview-hpa
  - target:
      kind: HorizontalPodAutoscaler
      name: chive-frontend-hpa
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: chive-frontend-hpa
  - target:
      kind: PodDisruptionBudget
      name: chive-appview-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: chive-appview-pdb
  - target:
      kind: PodDisruptionBudget
      name: chive-frontend-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: chive-frontend-pdb
  - target:
      kind: PodDisruptionBudget
      name: chive-indexer-pdb
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: chive-indexer-pdb
