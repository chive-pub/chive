apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chive-staging

resources:
  - ../../base

# No namePrefix.
#
# Each overlay already deploys into its own namespace, so a prefix isolates
# nothing the namespace does not. What it did do was rename every Service while
# the addresses in the ConfigMap stayed unprefixed, so no pod could resolve its
# dependencies.

commonLabels:
  environment: staging

# Override images with staging tags
images:
  - name: chive
    newName: ghcr.io/chive-pub/chive
    newTag: staging
  - name: chive-frontend
    newName: ghcr.io/chive-pub/chive-frontend
    newTag: staging

patches:
  # 2 replicas for staging
  - target:
      kind: Deployment
      name: chive-appview
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: chive-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # Moderate resources for staging
  - target:
      kind: Deployment
      name: chive-appview
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

  - target:
      kind: Deployment
      name: chive-indexer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

  # HPA with conservative scaling
  - target:
      kind: HorizontalPodAutoscaler
      name: chive-appview-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5

  # PDB minimum available
  - target:
      kind: PodDisruptionBudget
      name: chive-appview-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1

  # Environment name and log level.
  #
  # This was a `configMapGenerator` with `behavior: merge` naming a ConfigMap
  # that exists in no base. Kustomize can only merge a generator into another
  # generator, so `kubectl kustomize` failed outright — every overlay was
  # unbuildable, and no workflow built one, so none of them said so.
  # `chive-config` arrives from base as a plain resource, and a patch is how
  # you override one.
  - target:
      kind: ConfigMap
      name: chive-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: chive-config
      data:
        NODE_ENV: "staging"
        LOG_LEVEL: "info"
