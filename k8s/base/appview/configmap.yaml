apiVersion: v1
kind: ConfigMap
metadata:
  # Service addresses are bare names, not fully qualified.
  #
  # They used to read `<service>.chive.svc.cluster.local`, which pins them to the
  # `chive` namespace. Every overlay deploys into a different one — `chive-dev`,
  # `chive-staging`, `chive-prod` — so each pod was pointed at a namespace its own
  # Services did not live in. A bare name resolves through the pod's DNS search
  # path and is therefore correct in whichever namespace it is applied to.
  name: chive-config
  namespace: chive
  labels:
    app.kubernetes.io/name: chive
    app.kubernetes.io/part-of: chive
data:
  # PostgreSQL
  POSTGRES_HOST: 'postgresql'
  POSTGRES_PORT: '5432'
  POSTGRES_DB: 'chive'
  POSTGRES_USER: 'chive'

  # Redis
  REDIS_HOST: 'redis'
  REDIS_PORT: '6379'
  REDIS_DB: '0'
  REDIS_KEY_PREFIX: 'chive:'

  # Elasticsearch
  ELASTICSEARCH_URL: 'http://elasticsearch:9200'
  ELASTICSEARCH_REQUEST_TIMEOUT: '30000'
  ELASTICSEARCH_MAX_RETRIES: '3'
  ELASTICSEARCH_MAX_CONNECTIONS: '10'

  # Neo4j
  NEO4J_URI: 'bolt://neo4j:7687'
  NEO4J_USER: 'neo4j'

  # ATProto
  ATPROTO_RELAY_URL: 'wss://bsky.network'
  ATPROTO_PDS_URL: 'https://bsky.social'
  GRAPH_PDS_DID: 'did:plc:5wzpn4a4nbqtz3q45hyud6hd'

  # Application
  LOG_LEVEL: 'info'
  RATE_LIMIT_FAIL_MODE: 'closed'
  STALENESS_THRESHOLD_MS: '604800000'

  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector:4318'
