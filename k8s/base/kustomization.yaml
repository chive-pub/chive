apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: chive-base

namespace: chive

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: chive

resources:
  # Namespace
  - namespace.yaml

  # RBAC
  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  - rbac/role-bindings.yaml

  # AppView (API)
  - appview/deployment.yaml
  - appview/service.yaml
  - appview/configmap.yaml
  - appview/hpa.yaml
  - appview/pdb.yaml

  # Indexer (Firehose Consumer)
  - indexer/deployment.yaml
  - indexer/service.yaml
  - indexer/configmap.yaml
  - indexer/pdb.yaml

  # Frontend
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/hpa.yaml
  - frontend/pdb.yaml

  # Ingress
  - ingress/ingress.yaml
  - ingress/certificate.yaml

  # Databases (optional, comment out if using external DBs)
  - databases/postgresql.yaml
  - databases/redis.yaml
  - databases/elasticsearch.yaml
  - databases/neo4j.yaml

# Images can be overridden in overlays.
#
# `newName` matters as much as `newTag`: the manifests referred to the bare
# names `chive` and `chive-frontend`, which resolve against Docker Hub, while CI
# publishes to ghcr.io/chive-pub/chive. Overlays set only `newTag`, so no
# environment could pull an image.
#
# CI tags images `type=sha` and `type=ref,event=branch` — it never produces
# `latest`, so that tag was unpullable everywhere. Tags below match branches CI
# actually builds from.
#
# chive-frontend is NOT published by CI. The production deploy builds the web
# image on the server from web/Dockerfile and never pushes it, so there is no
# registry copy to pull. Deploying the frontend to Kubernetes requires
# publishing that image first; see k8s/README.md.
images:
  - name: chive
    newName: ghcr.io/chive-pub/chive
    newTag: main
  - name: chive-frontend
    newName: ghcr.io/chive-pub/chive-frontend
    newTag: main
